<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คืนฝนตกที่หมู่บ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060c;--ink:#e9e4d4;--lamp:#f2c66b;--heart:#e8e8f0;--panel:rgba(8,8,18,.78);--red:#c0463c}
@media (prefers-color-scheme:dark){:root{--bg:#05060c}}
:root[data-theme="dark"]{--bg:#05060c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Sarabun',sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;pointer-events:none}
#hearts{top:3%;left:2.5%;font-size:1.9em;letter-spacing:.12em;color:var(--heart);text-shadow:0 0 .4em #8aa0ff}
#hearts .off{opacity:.18}
#slot{top:3%;right:2.5%;width:3.4em;height:3.4em;border:2px solid #d9a441;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:1em}
#inv{bottom:3%;left:50%;transform:translateX(-50%);display:flex;gap:.9em}
.it{width:3.2em;height:3.2em;border-radius:50%;background:var(--panel);border:2px solid #444a66;display:flex;align-items:center;justify-content:center;font-size:1.1em;filter:grayscale(1) brightness(.5);transition:filter .3s}
.it.on{filter:none;border-color:var(--lamp)}
.it.live{box-shadow:0 0 1em var(--lamp)}
#toast{bottom:19%;left:50%;transform:translateX(-50%);max-width:80%;padding:.5em 1em;background:var(--panel);border-left:3px solid var(--lamp);font-size:1.15em;line-height:1.4;opacity:0;transition:opacity .3s;text-align:center}
#toast.show{opacity:1}
#prompt{top:12%;left:50%;transform:translateX(-50%);font-size:1.05em;color:var(--lamp);opacity:0;transition:opacity .2s;text-shadow:0 0 .6em #000}
#prompt.show{opacity:1}
.btn{position:absolute;bottom:4%;width:4.6em;height:4.6em;border-radius:50%;border:2px solid #6a7096;background:var(--panel);color:var(--ink);font:inherit;font-size:1.1em;display:flex;align-items:center;justify-content:center;touch-action:none}
.btn:active{background:#2a2f4a}
#bl{left:2.5%}#br{left:calc(2.5% + 5.4em)}
#bact{right:2.5%;border-color:var(--lamp);color:var(--lamp);font-size:.8em;font-family:'Press Start 2P',monospace}
#bfl{right:calc(2.5% + 6em);font-size:1.5em}
.ov{position:absolute;inset:0;background:rgba(3,4,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1em;padding:2em;z-index:5}
.ov.hide{display:none}
.ov h1{font-family:'Press Start 2P',monospace;font-size:1.9em;line-height:1.6;margin:0;color:var(--lamp);font-weight:400}
.ov p{margin:0;max-width:32em;line-height:1.6;font-size:1.05em;color:#b9bdd0}
.ov button{font:inherit;font-weight:700;font-size:1.15em;padding:.6em 1.6em;background:transparent;color:var(--lamp);border:2px solid var(--lamp);cursor:pointer}
.ov button:hover,.ov button:focus-visible{background:var(--lamp);color:#111;outline:none}

.pz{background:rgba(4,6,12,.94);justify-content:flex-start;gap:.5em;padding:1.4em 2em;overflow:auto}
.pz h2{margin:0;font-family:'Press Start 2P',monospace;font-size:1.05em;color:#7fdca0;font-weight:400}
.pz p{font-size:.95em}
.code{font-family:'Courier New',monospace;font-size:1.05em;text-align:left;width:min(32em,92%);color:#7fdca0}
.ln{min-height:1.7em;padding:.1em .6em;border-left:2px solid #2d5a40;background:rgba(20,50,35,.35);margin:.1em 0;cursor:pointer;color:#bff2d0}
.ln.e{color:#3f6a52;cursor:default}
.tks{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;max-width:36em}
.tk{font-family:'Courier New',monospace;font-size:.95em;padding:.3em .7em;background:#101a14;color:#bff2d0;border:1px solid #3f7a58;cursor:pointer}
.tk.u{opacity:.25;pointer-events:none}.tk.s{background:#7fdca0;color:#06120b}
.row{display:flex;gap:.8em}.row button{font-size:.95em;padding:.4em 1.2em}
#fb{min-height:1.5em;color:var(--lamp);font-size:.95em}
#inv{pointer-events:auto}.it{cursor:pointer}
#bar{top:11%;left:2.5%;width:7em;height:.7em;border:1px solid #d9a441;background:var(--panel)}#barf{display:block;height:100%;width:100%;background:#f2c66b}
#bcr{right:calc(2.5% + 11.6em)}
.btn{display:none}
@media (hover:none) and (pointer:coarse){.btn{display:flex}}
#jsc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:9;display:none;pointer-events:none;background:#000}
#jsc.on{display:block;animation:jz 1.2s ease-out forwards}
@keyframes jz{0%{transform:scale(.25);filter:brightness(4) contrast(2)}8%{transform:scale(1.25);filter:brightness(2)}16%{transform:scale(1.05) translate(-2%,1.5%)}24%{transform:scale(1.22) translate(2%,-1.5%)}32%{transform:scale(1.1) translate(-1.5%,-1%)}40%{transform:scale(1.25) translate(1.5%,1%);filter:brightness(1.4)}80%{transform:scale(1.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
</style>
</head>

  t+=dt;if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('show')}

  if(state!=='play')return;

  if(candleT>0)candleT-=dt;
  $('barf').style.width=charge+'%';$('barf').style.background=charge<25?'#c0463c':'#f2c66b';
  if(d){P.f=d;P.x+=d*(crouch?30:62)*dt;P.walk+=dt*9;Snd.stepT-=dt;if(Snd.stepT<=0){Snd.step();Snd.stepT=.4}}

  if(level>=2||P.x>1000){
    const dist=P.x-ghost.x,ad=Math.abs(dist);

    let sp=ad<240?[0,34,44,48,54][level]:0;
    if(ghost.gone>0){ghost.gone-=dt;if(ghost.gone<=0){ghost.x=Math.max(60,Math.min(WW-60,P.x+(Math.random()<.5?-1:1)*(240+Math.random()*90)));Snd.whisp()}}
    else if(lit&&!hidden){ghost.gone=4+Math.random()*2;Snd.vanish();say('เงาหายไปในแสงไฟฉาย… แต่มันจะกลับมา')}
    else{if(!hidden)ghost.x+=Math.sign(dist)*sp*dt;else ghost.x+=Math.sin(t)*14*dt;ghost.a=Math.min(1,ghost.a+dt*.8)}
    if(ghost.hit>0)ghost.hit-=dt;
    if(!hidden&&ghost.gone<=0&&ad<14&&ghost.hit<=0){P.hp--;Snd.hit();ghost.hit=1.6;P.x-=Math.sign(dist)*40;hearts();say('เงาเย็นเฉียบแตะไหล่… ใช้ไฟฉายส่องมัน');if(P.hp<=0)over()}
  }
  function hurt(o,dist){P.hp--;Snd.hit();o.hit=1.6;P.x-=Math.sign(dist)*40;hearts();say('เงาเย็นเฉียบแตะไหล่…');if(P.hp<=0)over()}
  for(const o of foes){
    if(level<(o.k==='wp'?2:3))continue;
    const dist=P.x-o.x,ad=Math.abs(dist);if(o.hit>0)o.hit-=dt;
    if(o.gone>0){o.gone-=dt;if(o.gone<=0){o.x=Math.max(60,Math.min(WW-60,P.x+(Math.random()<.5?-1:1)*(260+Math.random()*90)));Snd.whisp()}continue}
    const lit=(flash&&((P.f>0&&dist>0)||(P.f<0&&dist<0))&&ad<180)||(candleT>0&&ad<70);
    if(lit&&!hidden){o.gone=5;Snd.vanish();continue}
    if(o.k==='g2'){if(!hidden&&ad<260)o.x+=Math.sign(dist)*58*dt;if(!hidden&&ad<14&&o.hit<=0)hurt(o,dist)}
    else{
      if(!hidden)o.x+=Math.sign(dist)*(ad<110?72:38)*dt;else o.x+=Math.sin(t)*20*dt;
      const tg=ad<110?34:41+21*Math.sin(t*2.2);o.y+=(tg-o.y)*Math.min(1,dt*4);
      if(!hidden&&ad<14&&o.y<(crouch?24:48)&&o.hit<=0)hurt(o,dist);
    }
  }
  const s=near();const p=$('prompt');
  if(s){p.textContent='E · '+s.label;p.classList.add('show')}else if(charge<=0&&!hidden){p.textContent='E / H · หมอบซ่อนในความมืด';p.classList.add('show')}else p.classList.remove('show');
}

    dx.fillStyle=g;dx.beginPath();dx.moveTo(hx+P.f*8,y);dx.lineTo(hx+P.f*L,y-66);dx.lineTo(hx+P.f*L,y+66);dx.fill()}
  ctx.drawImage(dk,0,0);
  if(flash&&charge>0){const h2=px(P.x),L2=230,y2=GY-24,g2=ctx.createLinearGradient(h2,0,h2+P.f*L2,0);g2.addColorStop(0,'rgba(255,245,210,.26)');g2.addColorStop(1,'rgba(255,245,210,0)');ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(h2+P.f*8,y2);ctx.lineTo(h2+P.f*L2,y2-66);ctx.lineTo(h2+P.f*L2,y2+66);ctx.fill()}
  // warm lamp tint
  for(const l of lamps()){const lx=l.x-cam;const g=ctx.createRadialGradient(lx,l.y+6,2,lx,l.y+6,60);g.addColorStop(0,'rgba(255,200,110,.28)');g.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=g;ctx.fillRect(lx-60,l.y-54,120,120)}
  // vignette
  const v=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,W*.62);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(Snd.sh>0){ctx.fillStyle='rgba(170,10,10,'+Snd.sh*.5+')';ctx.fillRect(0,0,W,H)}
}

let last=performance.now();
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;update(dt);draw();requestAnimationFrame(loop)}
hearts();inv();requestAnimationFrame(loop);
})();
</script>
